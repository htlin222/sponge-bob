# 術語表 — 海綿寶寶台灣配音版
#
#   Whisper 的 prompt 參數（上限僅 224 tokens）→ 只取 whisper_hint: true 的 correct 詞，
#                                                依本檔順序貪婪填充，不做智慧排序
#
# 收錄原則：只放**資料夾裡的集名實際出現過**、或台灣配音版確定的譯名。
# 不確定的譯名寧可不放——寫錯的 hint 會把 Whisper 往錯的方向推。
#
# wrong 欄位只記錄「實際發生過的錯誤轉錄」，不是想像的。空著代表還沒觀察到。
# 之後從 _psr/*.raw.srt 統計誤聽再補上。
#
# 順序 = 優先序：越常出現的角色越前面，prompt 超過上限時從尾端截掉。

version: 1

# 已知的 Whisper 幻覺字句：轉錄後、加標點前整段刪除（psr/cleanup.py）。
# 比對會折疊繁簡、大小寫、空白與標點。同樣只收實測看過的。
hallucinations:
  - "優優獨播劇場"                       # S01E01 片尾，實測
  - "YoYo Television Series Exclusive"  # S01E01 片尾，實測

terms:
  # ── 主要角色 ────────────────────────────────────────────
  - correct: "海綿寶寶"
    wrong: ["快點寶寶", "快點抱抱", "海面泡泡", "麥麵包包", "愛麵包包", "愛面抱抱", "麥面泡泡", "海邊泡泡", "海面寶寶", "海邊寶寶", "海明寶寶", "海鳴寶寶", "還沒寶寶", "愛面寶寶", "海年寶寶", "海天寶寶", "海鮮寶寶", "河邊寶寶"]
    whisper_hint: true
  - correct: "派大星"
    wrong: ["拍打機", "太大心", "太大戲", "拍打戲", "拍打雞", "白大戲", "麥大西", "拜大西", "蔡大西", "派塔西", "派大西", "派達西", "拍大戲", "拍大星", "潘大西", "白大西", "派大仙", "海大星", "潘大星", "拍打星", "排大星", "太大星", "派大席", "白大星", "海大西", "派達星", "派泰西", "拍大西", "排大西", "泰大星", "潘大仙", "白大仙", "派太西", "白太心", "拍大吉", "拍大機", "潘太心"]
    whisper_hint: true
  - correct: "章魚哥"
    wrong: ["鄭雲哥", "將宇哥", "趙瑜哥", "湛羽哥", "強宇哥", "張漁哥", "張宇歌", "江一哥", "張宇哥", "鄭宇哥", "張雲哥", "張一哥", "江玉哥", "趙宇哥", "家瑜哥", "江宇哥", "嘉宇哥", "張愚哥", "張獄哥", "焦魚哥", "鯊魚哥"]
    whisper_hint: true
    note: "S01E01 實測：即使 prompt 有「章魚哥」，Whisper 仍聽成張宇哥／郑宇哥。"
  - correct: "蟹老闆"
    wrong: ["謝老闆", "借老闆", "縣老闆"]
    whisper_hint: true
  - correct: "珊迪"
