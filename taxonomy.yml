# 金句分類表 — `bob index` 讓 Haiku 只能從這裡挑標籤（JSON schema enum 強制）。
#
# 刻意保持封閉：自由標籤會長出「上班」「工作」「職場」三個同義詞，
# 查詢時就漏掉一半。Haiku 覺得不夠用時會在 new_tags 提案，人工審過再加進來。
# 改動本檔會改變 index 版本，下次 `bob index` 會整批重標。

