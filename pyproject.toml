[project]
name = "psr"
version = "0.1.0"
description = "sponge-bob: batch zh-Hant SRT subtitles for a Google Drive folder, built on polish-screen-record"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.198.0",
    "google-auth-oauthlib>=1.4.0",
    "groq>=1.6.0",
    "openai>=3.1.0",
    "opencc-python-reimplemented>=0.1.7",
    "pypinyin>=0.55.0",
    "pyyaml>=6.0.3",
    "zhconv>=1.4.3",
]

[project.scripts]
psr = "psr.cli:main"
bob = "psr.bob:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psr"]
